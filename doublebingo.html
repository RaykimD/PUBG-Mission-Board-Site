<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHABET BINGO - DUAL MODE</title>
    <style>
        /* === 전역 CSS 변수 (테마 & 팀 컬러) === */
        :root {
            --bg-body: #0f0f0f; --bg-panel: #1a1a1a; --bg-control: #1e1e1e; --bg-log: #151515;
            --text-main: #ffffff; --text-sub: #aaaaaa; --border-color: #333333;
            --cell-bg: #2c2c2c; --cell-border: #444444; --stats-bg: #111111;
            
            --team1-color: #3a86ff; --team1-rgb: 58, 134, 255;
            --team2-color: #ff006e; --team2-rgb: 255, 0, 110;
        }

        body.light-mode {
            --bg-body: #e5e7eb; --bg-panel: #ffffff; --bg-control: #f3f4f6; --bg-log: #ffffff;
            --text-main: #1f2937; --text-sub: #4b5563; --border-color: #d1d5db;
            --cell-bg: #f9fafb; --cell-border: #d1d5db; --stats-bg: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: var(--bg-body); color: var(--text-main); 
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif; transition: 0.3s;
        }
        
        .layout-container { display: grid; grid-template-columns: 5fr 4fr 1.5fr; height: 100vh; max-height: 100vh; }

        .broadcast-section, .control-section, .log-section {
            height: 100vh; min-height: 0; display: flex; flex-direction: column; padding: 20px;
        }

        .section-header {
            font-size: 1.5rem; font-weight: 900; color: var(--text-main); text-align: center;
            margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color);
            letter-spacing: 2px; flex-shrink: 0; background-color: var(--bg-panel);
            padding-top: 10px; border-radius: 8px; transition: 0.3s; position: relative;
        }

        /* --- 링크 복사 버튼 --- */
        .btn-copy {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            padding: 6px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 6px;
            background-color: var(--border-color); color: var(--text-main); border: none;
            cursor: pointer; transition: 0.2s;
        }
        .btn-copy:hover { background-color: var(--text-sub); color: #fff; }

        .team-stats {
            text-align: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px;
            background-color: var(--stats-bg); padding: 10px; border-radius: 8px;
            border: 1px solid var(--border-color); transition: 0.3s;
        }
        .stats-check { color: #4ade80; } .stats-remain { color: #f87171; } .stats-divider { color: var(--text-sub); margin: 0 10px; }

        .broadcast-section { background-color: var(--bg-body); border-right: 2px solid var(--border-color); }
        .boards-container { display: flex; gap: 20px; flex: 1; justify-content: center; align-items: center; min-height: 0; }
        
        .board-wrapper {
            width: 100%; max-width: 420px; display: flex; flex-direction: column;
            border: 4px solid; border-radius: 16px; padding: 20px;
            background-color: var(--bg-panel); transition: 0.3s;
        }
        #team1-board-view { border-color: var(--team1-color); box-shadow: 0 0 20px rgba(var(--team1-rgb), 0.15); }
        #team2-board-view { border-color: var(--team2-color); box-shadow: 0 0 20px rgba(var(--team2-rgb), 0.15); }

        .team-name-display { text-align: center; font-size: 2rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        #team1-name-view { color: var(--team1-color); } #team2-name-view { color: var(--team2-color); }

        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
        .view-cell {
            aspect-ratio: 1 / 1; background-color: var(--cell-bg); border: 2px solid var(--cell-border);
            border-radius: 8px; display: flex; justify-content: center; align-items: center;
            font-size: 2rem; font-weight: 800; color: var(--text-sub); transition: 0.2s;
        }

        .control-section { background-color: var(--bg-control); border-right: 2px solid var(--border-color); }
        .tab-header { display: flex; gap: 10px; margin-bottom: 15px; flex-shrink: 0; }
        .tab-btn {
            flex: 1; padding: 15px; font-size: 1.1rem; font-weight: bold; border: 2px solid var(--border-color); 
            border-radius: 8px; cursor: pointer; background-color: var(--bg-panel); color: var(--text-sub); transition: 0.2s;
        }
        .tab-btn.active#btn-tab1 { background-color: var(--team1-color); color: #fff; border-color: var(--team1-color); }
        .tab-btn.active#btn-tab2 { background-color: var(--team2-color); color: #fff; border-color: var(--team2-color); }

        .tab-content { display: none; flex-direction: column; flex: 1; }
        .tab-content.active { display: flex; }

        .control-tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; flex-shrink: 0; }
        .team-input-group { display: flex; gap: 10px; }
        .team-input-group input[type="color"] {
            width: 50px; height: 46px; border: 2px solid var(--border-color); border-radius: 8px; 
            background: var(--bg-panel); cursor: pointer; padding: 2px; flex-shrink: 0;
        }
        .team-input-group input[type="text"] {
            flex: 1; padding: 10px; font-size: 1.2rem; font-weight: bold; border: 2px solid var(--border-color); 
            border-radius: 8px; background: var(--bg-panel); color: var(--text-main); text-align: center;
        }

        /* 컨트롤 버튼 그룹 (리셋 & 에디트) */
        .action-group { display: flex; gap: 10px; }
        .btn-team1, .btn-team2 {
            flex: 2; padding: 12px; font-size: 1.1rem; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; color: white; transition: 0.2s;
        }
        .btn-team1 { background-color: var(--team1-color); }
        .btn-team2 { background-color: var(--team2-color); }
        .btn-team1:hover, .btn-team2:hover { filter: brightness(0.8); }

        .btn-edit {
            flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; background-color: #444; color: #fff; transition: 0.2s;
        }
        .btn-edit:hover { background-color: #666; }
        .btn-edit.active { background-color: #ffbe0b; color: #000; animation: blink 1s infinite alternate; }
        
        @keyframes blink { from { opacity: 1; } to { opacity: 0.7; } }

        .control-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
            width: 100%; max-width: 480px; margin: 0 auto;
        }
        .control-cell {
            aspect-ratio: 1 / 1; background-color: var(--cell-bg); border: 2px solid var(--cell-border); border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; font-weight: bold; color: var(--text-main); cursor: pointer; user-select: none; transition: 0.1s;
        }
        .control-cell:hover { filter: brightness(0.85); transform: scale(0.98); }

        .active-team1 { background-color: var(--team1-color) !important; color: #fff !important; border-color: #fff !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .active-team2 { background-color: var(--team2-color) !important; color: #fff !important; border-color: #fff !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }

        .global-controls { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 20px; border-top: 2px solid var(--border-color); flex-shrink: 0; }
        .btn-action { width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-reset { background-color: #ffbe0b; color: #000; } .btn-reset:hover { background-color: #e5ab00; }
        .btn-theme { background-color: var(--bg-panel); color: var(--text-main); border: 2px solid var(--border-color); }
        .btn-theme:hover { background-color: var(--border-color); }

        .log-section { background-color: var(--bg-log); }
        .log-header { font-size: 1.2rem; font-weight: 900; margin-bottom: 15px; text-align: center; color: var(--text-main); letter-spacing: 1px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; flex-shrink: 0; }
        .log-container { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        .log-container::-webkit-scrollbar { width: 6px; } .log-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .log-item { padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.3s ease-in-out; flex-wrap: wrap; gap: 5px; flex-shrink: 0; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .log-team1 { background-color: rgba(var(--team1-rgb), 0.15); border-left: 4px solid var(--team1-color); color: var(--text-main); }
        .log-team1 .team-name-tag { color: var(--team1-color); }
        .log-team2 { background-color: rgba(var(--team2-rgb), 0.15); border-left: 4px solid var(--team2-color); color: var(--text-main); }
        .log-team2 .team-name-tag { color: var(--team2-color); }
        .log-system { background-color: var(--bg-panel); border-left: 4px solid #ffbe0b; color: var(--text-sub); text-align: center; justify-content: center;}
        
        .log-letter { font-size: 1rem; color: var(--text-main); }
        .log-action-add { color: #4ade80; } .log-action-remove { color: #f87171; text-decoration: line-through; } 
    </style>
</head>
<body>

<div class="layout-container">
    
    <div class="broadcast-section" id="broadcast-area">
        <div class="section-header">📺 방송 송출용</div>
        <div class="boards-container">
            <div class="board-wrapper" id="team1-board-view">
                <div class="team-name-display" id="team1-name-view">TEAM 1</div>
                <div class="team-stats" id="view-stats1"></div>
                <div class="bingo-grid" id="view-grid1"></div>
            </div>
            <div class="board-wrapper" id="team2-board-view">
                <div class="team-name-display" id="team2-name-view">TEAM 2</div>
                <div class="team-stats" id="view-stats2"></div>
                <div class="bingo-grid" id="view-grid2"></div>
            </div>
        </div>
    </div>

    <div class="control-section">
        <div class="section-header">
            🕹️ 입력칸
            <!-- 링크 복사 버튼 추가 -->
            <button class="btn-copy" onclick="copyRoomLink()">🔗 링크 복사</button>
        </div>
        
        <div class="tab-header">
            <button class="tab-btn active" id="btn-tab1" onclick="switchTab(1)">1팀 빙고</button>
            <button class="tab-btn" id="btn-tab2" onclick="switchTab(2)">2팀 빙고</button>
        </div>

        <div class="tab-content active" id="tab1">
            <div class="control-tools">
                <div class="team-input-group">
                    <input type="color" id="team1-color" value="#3a86ff" onchange="updateTeamColor(1)" title="1팀 색상 변경">
                    <input type="text" id="team1-input" value="TEAM 1" oninput="updateTeamName(1)">
                </div>
                <div class="action-group">
                    <!-- 버튼명 변경 -->
                    <button class="btn-team1" onclick="generateBingo(1, true)">1팀 빙고 리셋</button>
                    <!-- 수정 모드 버튼 추가 -->
                    <button class="btn-edit" id="btn-edit-1" onclick="toggleEditMode(1)">✏️ 칸 수정</button>
                </div>
            </div>
            <div class="control-grid" id="control-grid1"></div>
        </div>

        <div class="tab-content" id="tab2">
            <div class="control-tools">
                <div class="team-input-group">
                    <input type="color" id="team2-color" value="#ff006e" onchange="updateTeamColor(2)" title="2팀 색상 변경">
                    <input type="text" id="team2-input" value="TEAM 2" oninput="updateTeamName(2)">
                </div>
                <div class="action-group">
                    <!-- 버튼명 변경 -->
                    <button class="btn-team2" onclick="generateBingo(2, true)">2팀 빙고 리셋</button>
                    <!-- 수정 모드 버튼 추가 -->
                    <button class="btn-edit" id="btn-edit-2" onclick="toggleEditMode(2)">✏️ 칸 수정</button>
                </div>
            </div>
            <div class="control-grid" id="control-grid2"></div>
        </div>

        <div class="global-controls">
            <button class="btn-action btn-theme" onclick="toggleTheme()">🌗 다크 / 라이트 모드 전환</button>
            <button class="btn-action btn-reset" onclick="resetAll()">전체 초기화 (로그 포함)</button>
        </div>
    </div>

    <div class="log-section">
        <div class="log-header">ACTION LOG</div>
        <div class="log-container" id="log-container"></div>
    </div>

</div>

<script>
    const ALL_ALPHABETS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let teamStats = { 1: { checked: 0, total: 25 }, 2: { checked: 0, total: 25 } };
    
    // 에디트 모드 상태 저장
    let editMode = { 1: false, 2: false };

    // 링크 복사 함수
    function copyRoomLink() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert("방 링크가 복사되었습니다!\n함께할 팀원에게 공유해주세요.");
        }).catch(() => {
            alert("링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요.");
        });
    }

    // 칸 수정 모드 토글 함수
    function toggleEditMode(teamNum) {
        editMode[teamNum] = !editMode[teamNum];
        const btn = document.getElementById(`btn-edit-${teamNum}`);
        if (editMode[teamNum]) {
            btn.classList.add('active');
            btn.textContent = "✅ 수정 완료";
        } else {
            btn.classList.remove('active');
            btn.textContent = "✏️ 칸 수정";
        }
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function hexToRgb(hex) {
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : "0,0,0";
    }

    function updateTeamColor(teamNum) {
        const hexColor = document.getElementById(`team${teamNum}-color`).value;
        document.documentElement.style.setProperty(`--team${teamNum}-color`, hexColor);
        document.documentElement.style.setProperty(`--team${teamNum}-rgb`, hexToRgb(hexColor));
    }

    function getRandomAlphabets() {
        let shuffled = [...ALL_ALPHABETS];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, 25);
    }

    function switchTab(teamNum) {
        document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(`btn-tab${teamNum}`).classList.add('active');
        document.getElementById(`tab${teamNum}`).classList.add('active');
    }

    function updateStatsUI(teamNum) {
        const stats = teamStats[teamNum];
        document.getElementById(`view-stats${teamNum}`).innerHTML = `
            <span class="stats-check">체크: ${stats.checked}</span>
            <span class="stats-divider">|</span>
            <span class="stats-remain">남은 칸: ${stats.total - stats.checked}</span>
        `;
    }

    function addLog(teamNum, letter, isChecked, isSystemLog = false, msg = "") {
        const logContainer = document.getElementById("log-container");
        const logItem = document.createElement("div");
        
        if (isSystemLog) {
            logItem.className = "log-item log-system";
            logItem.textContent = msg;
        } else {
            const teamName = document.getElementById(`team${teamNum}-input`).value || `TEAM ${teamNum}`;
            logItem.className = `log-item log-team${teamNum}`;
            logItem.innerHTML = `<span class="team-name-tag">[${teamName}]</span><span class="log-letter">${letter}</span>${isChecked ? `<span class="log-action-add">체크</span>` : `<span class="log-action-remove">취소</span>`}`;
        }
        logContainer.prepend(logItem);
    }

    function generateBingo(teamNum, isManual = false) {
        // 리셋 시 에디트 모드 강제 해제
        if (editMode[teamNum]) toggleEditMode(teamNum);

        const viewGrid = document.getElementById(`view-grid${teamNum}`);
        const controlGrid = document.getElementById(`control-grid${teamNum}`);
        viewGrid.innerHTML = ""; controlGrid.innerHTML = "";

        teamStats[teamNum].checked = 0;
        updateStatsUI(teamNum);

        getRandomAlphabets().forEach((letter, index) => {
            const viewCell = document.createElement("div");
            viewCell.className = "view-cell";
            viewCell.id = `view-cell-${teamNum}-${index}`; 
            viewCell.textContent = letter;
            viewGrid.appendChild(viewCell);

            const controlCell = document.createElement("div");
            controlCell.className = "control-cell";
            controlCell.textContent = letter;
            
            controlCell.onclick = function() {
                // 1. 에디트 모드가 켜져 있을 때의 로직 (마킹 대신 알파벳 수정)
                if (editMode[teamNum]) {
                    const currentLetter = this.textContent;
                    let newLetter = prompt(`[현재 알파벳: ${currentLetter}]\n원하시는 새로운 알파벳(A~Z)이나 문자를 입력하세요:`, currentLetter);
                    
                    if (newLetter !== null && newLetter.trim() !== "") {
                        // 첫 글자만 대문자로 추출
                        newLetter = newLetter.trim().substring(0, 1).toUpperCase();
                        
                        this.textContent = newLetter;
                        document.getElementById(`view-cell-${teamNum}-${index}`).textContent = newLetter;
                        
                        const teamName = document.getElementById(`team${teamNum}-input`).value || `TEAM ${teamNum}`;
                        addLog(0, "", false, true, `✏️ [${teamName}] ${currentLetter} -> ${newLetter} 변경`);
                    }
                    return; // 에디트 모드일 땐 마킹을 진행하지 않고 종료
                }

                // 2. 평상시 로직 (클릭 시 마킹 및 카운터 증가/감소)
                const targetClass = `active-team${teamNum}`;
                const isNowChecked = this.classList.toggle(targetClass);
                document.getElementById(`view-cell-${teamNum}-${index}`).classList.toggle(targetClass);

                if (isNowChecked) teamStats[teamNum].checked++;
                else teamStats[teamNum].checked--;
                
                updateStatsUI(teamNum);
                addLog(teamNum, this.textContent, isNowChecked);
            };
            controlGrid.appendChild(controlCell);
        });

        if (isManual) {
            const teamName = document.getElementById(`team${teamNum}-input`).value || `TEAM ${teamNum}`;
            addLog(teamNum, "", false, true, `🔄 ${teamName} 보드 리셋 됨`);
        }
    }

    function updateTeamName(teamNum) {
        document.getElementById(`team${teamNum}-name-view`).textContent = document.getElementById(`team${teamNum}-input`).value || `TEAM ${teamNum}`;
    }

    function resetAll() {
        if(confirm("양 팀의 빙고판과 로그를 완전히 초기화하시겠습니까?")) {
            generateBingo(1); generateBingo(2);
            document.getElementById("log-container").innerHTML = ""; 
            addLog(0, "", false, true, "✨ 전체 판이 초기화 되었습니다");
        }
    }

    window.onload = () => {
        generateBingo(1); generateBingo(2);
        addLog(0, "", false, true, "🚀 알파벳 빙고 시스템 시작");
    };
</script>

</body>
</html>
